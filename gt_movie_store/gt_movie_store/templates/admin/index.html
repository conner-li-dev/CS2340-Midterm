{% extends "admin/index.html" %}

{% block content %}
    <div id="content-main" class="app-list">
        {% include "admin/app_list.html" with app_list=app_list show_changelinks=True %}
        <!-- Insert a admin nav tabs here -->
        {% if request.path == '/admin/' or request.path|slice:":17" == '/admin/engagement' %}
        <div class="module">
            <table style="width: 100%;">
                <caption>
                    <a href="/admin/" class="section" title="Tools for tracking user engagement">Engagement</a>
                </caption>
                <tbody>
                    <tr>
                        <th scope="row">
                            <a href="{% url 'cart_engagement_admin:engagement.most_purchased' %}">Highest Purchasing User</a>
                        </th>
                    </tr>
                </tbody>
            </table>
        </div>
        {% endif %}
    </div>
{% endblock content %}
