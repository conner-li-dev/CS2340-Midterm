{% load i18n %}
<button class="sticky toggle-nav-sidebar" id="toggle-nav-sidebar"
    aria-label="{% translate 'Toggle navigation' %}"></button>
<nav class="sticky" id="nav-sidebar" aria-label="{% translate 'Sidebar' %}">
    <input type="search" id="nav-filter" placeholder="{% translate 'Start typing to filter.' %}"
        aria-label="{% translate 'Filter navigation items' %}">
    {% include 'admin/app_list.html' with app_list=available_apps show_changelinks=False %}
    
    <!-- Insert a admin nav tabs here -->
    <div class="module {% if request.path|slice:":17" == '/admin/engagement' %}current-app{% endif %}">
        <table style="width: 100%;">
            <caption>
                <a href="/admin/" class="section" title="Tools for tracking user engagement">Engagement</a>
            </caption>
            <tbody>
                <tr>
                    <th scope="row">
                        <a href="{% url 'cart_engagement_admin:engagement.most_purchased' %}">Highest Purchasing User</a>
                    </th>
                </tr>
            </tbody>
            <tbody>
                    <tr>
                        <th scope="row">
                            <a href="{% url 'reviews_engagement_admin:reviews-engagement.most_reviews' %}">User with most reviews</a>
                        </th>
                    </tr>
            </tbody>
        </table>
    </div>
</nav>
